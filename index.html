<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; text-align: center; padding-top: 50px; }
    h1 { color: #333; }
    button { font-size: 1.2em; margin: 10px; padding: 10px 30px; }
    input { font-size: 1em; padding: 5px; margin: 5px; }
    #result { margin-top: 20px; color: #007700; }
  </style>
</head>
<body>
  <h1>伺服馬達控制面板</h1>
  <div>
    <label>ESP8266 API網址（例：http://192.168.1.123/servo）</label><br>
    <input id="api" type="text" value="http://192.168.1.123/servo" size="40"><br>
  </div>
  <button onclick="sendServo(90)">轉到90度</button>
  <button onclick="sendServo(0)">歸零</button>
  <div id="result"></div>
  <script>
    function sendServo(pos) {
      const api = document.getElementById('api').value;
      const token = '1357924680'; // 你的token
      fetch(api + '?pos=' + pos + '&token=' + encodeURIComponent(token))
        .then(r => r.text())
        .then(t => document.getElementById('result').innerText = t)
        .catch(e => document.getElementById('result').innerText = '連線失敗: ' + e);
    }
  </script>
</body>
</html>
