<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- 啟動畫面 -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">載入中…</div>
  </div>
  <h1>伺服馬達控制面板</h1>
  <div id="api-row">
    <label for="api">ESP8266 API網址（例：http://192.168.1.123/servo）</label>
    <input id="api" type="text" value="http://192.168.1.123/servo" size="40">
  </div>
  <div id="token-row">
    <label for="token">密碼：</label>
    <input id="token" type="text" value="" size="40">
  </div>
  <div class="container main-btn" onclick="sendServo(1)">
    <div class="btn-group">
      開/關門
    </div>
  </div>
  <div id="result"></div>
  <div class="secondary-btn-row">
    <button class="secondary-btn" onclick="sendServo(0)">歸零(出問題在按)</button>
  </div>
  <script>
    // 啟動畫面自動隱藏
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        document.getElementById('loading-screen').style.opacity = 0;
        setTimeout(function () {
          document.getElementById('loading-screen').style.display = 'none';
        }, 400);
      }, 800);
    });

    // 取得URL參數自動填值並隱藏input
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const apiParam = getQueryParam('api');
    const tokenParam = getQueryParam('token');
    if (apiParam && tokenParam) {
      document.getElementById('api').value = apiParam.replace(/^"(.*)"$/, '$1');   // 移除頭尾引號
      document.getElementById('token').value = tokenParam.replace(/^"(.*)"$/, '$1');
      document.getElementById('api-row').classList.add('hide');
      document.getElementById('token-row').classList.add('hide');
    }

    function sendServo(action) {
      const api = document.getElementById('api').value;
      const token = document.getElementById("token").value;
      fetch(api + '?action=' + action + '&token=' + encodeURIComponent(token),{
         headers: {
          'ngrok-skip-browser-warning': '1',
          // 其他header
        }
      })
        .then(r => r.text())
        .then(t => document.getElementById('result').innerText = t)
        .catch(e => document.getElementById('result').innerText = '連線失敗: ' + e);
    }
  </script>
</body>

</html>
