<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; text-align: center; padding-top: 50px; }
    h1 { color: #333; }
    button { font-size: 1.2em; margin: 10px; padding: 10px 30px; }
    input { font-size: 1em; padding: 5px; margin: 5px; }
    #result { margin-top: 20px; color: #007700; }
  </style>
</head>
<body>
  <h1>伺服馬達控制面板</h1>
  <div>
    <label>ESP8266 API網址（例：http://1.2.3.4:80/servo）</label><br>
    <input id="api" type="text" value="http://1.2.3.4:80/servo" size="40"><br>
    <label>Token：</label>
    <input id="token" type="text" value="mySecretToken"><br>
  </div>
  <button onclick="sendServo(90)">轉到90度</button>
  <button onclick="sendServo(0)">歸零</button>
  <div id="result"></div>
  <script>
    function sendServo(pos) {
      const api = document.getElementById('api').value;
      const token = document.getElementById('token').value;
      fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'pos=' + pos + '&token=' + encodeURIComponent(token)
      })
      .then(r => r.text())
      .then(t => document.getElementById('result').innerText = t)
      .catch(e => document.getElementById('result').innerText = '連線失敗: ' + e);
    }
  </script>
</body>
</html>
