<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <style>
    body {
      font-family: 'Microsoft JhengHei', 'Noto Sans TC', 'Arial', sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
      padding-top: 50px;
      min-height: 100vh;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 2.2em;
      letter-spacing: 2px;
    }
    .container {
      background: #fff;
      display: inline-block;
      padding: 32px 40px 24px 40px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.07);
    }
    label {
      display: block;
      margin: 18px 0 7px 0;
      font-weight: bold;
      font-size: 1.1em;
      text-align: left;
    }
    input[type="text"] {
      font-size: 1em;
      padding: 8px 10px;
      margin-bottom: 6px;
      width: 90%;
      max-width: 350px;
      border: 1px solid #bbb;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0077cc;
    }
    button {
      font-size: 1.13em;
      margin: 18px 15px 0 15px;
      padding: 10px 36px;
      border-radius: 8px;
      border: none;
      background: #0077cc;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      transition: background 0.2s;
    }
    button:hover {
      background: #005fa3;
    }
    #result {
      margin-top: 30px;
      color: #2a8a2a;
      font-weight: 500;
      min-height: 1.5em;
    }
    /* 深色模式 */
    @media (prefers-color-scheme: dark) {
      body {
        background: #181a1b;
        color: #eee;
      }
      .container {
        background: #23272a;
        box-shadow: 0 6px 24px rgba(0,0,0,0.23);
      }
      h1 {
        color: #fff;
      }
      input[type="text"] {
        background: #23272a;
        color: #fff;
        border: 1px solid #666;
      }
      input[type="text"]:focus {
        border-color: #3fa7ff;
      }
      button {
        background: #3fa7ff;
        color: #181a1b;
      }
      button:hover {
        background: #1e90ff;
      }
      #result {
        color: #73ff8a;
      }
    }
  </style>
</head>
<body>
  <h1>伺服馬達控制面板</h1>
  <div class="container">
    <label for="api">ESP8266 API網址（例：http://192.168.1.123/servo）</label>
    <input id="api" type="text" value="http://192.168.1.123/servo" size="40">

    <label for="password">密碼：</label>
    <input id="password" type="text" value="" size="40">

    <div>
      <button onclick="sendServo(1)">90度→歸零</button>
      <button onclick="sendServo(0)">歸零</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    function sendServo(action) {
      const api = document.getElementById('api').value;
      const token = document.getElementById("password").value;
      fetch(api + '?action=' + action + '&token=' + encodeURIComponent(token))
        .then(r => r.text())
        .then(t => document.getElementById('result').innerText = t)
        .catch(e => document.getElementById('result').innerText = '連線失敗: ' + e);
    }
  </script>
</body>
</html>
