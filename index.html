<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* ...（同前面RWD與深色模式CSS，自行複製即可）... */
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif; background: #f5f5f5; color: #222; text-align: center; padding-top: 50px; min-height: 100vh; transition: background 0.3s, color 0.3s; }
    h1 { color: #333; margin-bottom: 30px; font-size: 2em; letter-spacing: 2px; }
    .container { background: #fff; display: inline-block; padding: 28px 25px 22px 25px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.07); min-width: 300px; max-width: 98vw; }
    label { display: block; margin: 18px 0 7px 0; font-weight: bold; font-size: 1.1em; text-align: left; }
    input[type="text"] { font-size: 1em; padding: 8px 10px; margin-bottom: 6px; width: 95%; max-width: 340px; border: 1px solid #bbb; border-radius: 6px; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
    input[type="text"]:focus { border-color: #0077cc; }
    .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    button { font-size: 1.08em; margin: 0; padding: 10px 26px; border-radius: 8px; border: none; background: #0077cc; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.10); transition: background 0.2s; }
    button:hover, button:active { background: #005fa3; }
    #result { margin-top: 28px; color: #2a8a2a; font-weight: 500; min-height: 1.5em; word-break: break-all; }
    #loading-screen { position: fixed; z-index: 9999; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s; }
    .loader { border: 6px solid #eee; border-top: 6px solid #0077cc; border-radius: 50%; width: 56px; height: 56px; animation: spin 1.1s linear infinite; margin-bottom: 18px; }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    .loading-text { font-size: 1.1em; color: #0077cc; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      body { background: #181a1b; color: #eee; }
      .container { background: #23272a; box-shadow: 0 6px 24px rgba(0,0,0,0.23); }
      h1 { color: #fff; }
      input[type="text"] { background: #23272a; color: #fff; border: 1px solid #666; }
      input[type="text"]:focus { border-color: #3fa7ff; }
      button { background: #3fa7ff; color: #181a1b; }
      button:hover, button:active { background: #1e90ff; }
      #result { color: #73ff8a; }
      #loading-screen { background: rgba(24,26,27, 0.98); }
      .loading-text { color: #3fa7ff; }
      .loader { border: 6px solid #23272a; border-top: 6px solid #3fa7ff; }
    }
    @media (max-width: 600px) {
      body { padding-top: 25px; }
      .container { padding: 18px 3vw 14px 3vw; min-width: unset; }
      h1 { font-size: 1.35em; margin-bottom: 20px; }
      .btn-group { gap: 6px; }
      button { font-size: 1em; padding: 9px 16px; }
      label, .loading-text { font-size: 1em; }
    }
    /* 隱藏用 */
    .hide { display: none !important; }
  </style>
</head>
<body>
  <!-- 啟動畫面 -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">載入中…</div>
  </div>
  <h1>伺服馬達控制面板</h1>
  <div class="container">
    <div id="api-row">
      <label for="api">ESP8266 API網址（例：http://192.168.1.123/servo）</label>
      <input id="api" type="text" value="http://192.168.1.123/servo" size="40">
    </div>
    <div id="token-row">
      <label for="token">密碼：</label>
      <input id="token" type="text" value="" size="40">
    </div>
    <div class="btn-group">
      <button onclick="sendServo(1)">開/關門</button>
      <button onclick="sendServo(0)">歸零(出問題在按)</button>
    </div>
    <div id="result"></div>
  </div>
  <script>
    // 啟動畫面自動隱藏
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.getElementById('loading-screen').style.opacity = 0;
        setTimeout(function() {
          document.getElementById('loading-screen').style.display = 'none';
        }, 400);
      }, 800);
    });

    // 取得URL參數自動填值並隱藏input
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const apiParam = getQueryParam('api');
    const tokenParam = getQueryParam('token');
    if (apiParam && tokenParam) {
      document.getElementById('api').value = apiParam.replace(/^"(.*)"$/, '$1');   // 移除頭尾引號
      document.getElementById('token').value = tokenParam.replace(/^"(.*)"$/, '$1');
      document.getElementById('api-row').classList.add('hide');
      document.getElementById('token-row').classList.add('hide');
    }

    function sendServo(action) {
      const api = document.getElementById('api').value;
      const token = document.getElementById("token").value;
      fetch(api + '?action=' + action + '&token=' + encodeURIComponent(token))
        .then(r => r.text())
        .then(t => document.getElementById('result').innerText = t)
        .catch(e => document.getElementById('result').innerText = '連線失敗: ' + e);
    }
  </script>
</body>
</html>
