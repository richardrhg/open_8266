<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>伺服馬達控制面板</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,
    body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #222;
        text-align: center;
        padding: 20px;
        min-height: 100vh;
        transition: background 0.3s, color 0.3s;
        box-sizing: border-box;
    }

    h1 {
        color: #fff;
        margin-bottom: 30px;
        font-size: 2.2em;
        font-weight: 300;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        letter-spacing: 2px;
    }

    .main-container {
        max-width: 400px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 40px 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .input-group {
        margin-bottom: 25px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95em;
        color: #555;
    }

    input[type="text"] {
        font-size: 1em;
        padding: 12px 15px;
        width: 100%;
        border: 2px solid #e1e5e9;
        border-radius: 12px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background: #f8f9fa;
    }

    input[type="text"]:focus {
        border-color: #667eea;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .control-section {
        margin: 40px 0;
    }

    .main-btn {
        width: 100%;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-weight: 600;
        font-size: 1.3em;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        margin-bottom: 20px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .main-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
    }

    .main-btn:active:not(:disabled) {
        transform: translateY(0);
    }

    .main-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    .secondary-btn {
        width: 100%;
        padding: 15px;
        background: #6c757d;
        color: #fff;
        font-weight: 500;
        font-size: 1.1em;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .secondary-btn:hover:not(:disabled) {
        background: #5a6268;
        transform: translateY(-1px);
    }

    .secondary-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    .countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.2em;
        font-weight: bold;
    }

    #result {
        margin-top: 25px;
        padding: 15px;
        background: rgba(42, 138, 42, 0.1);
        border-radius: 10px;
        color: #2a8a2a;
        font-weight: 500;
        min-height: 20px;
        word-break: break-all;
        border-left: 4px solid #2a8a2a;
    }

    .result-error {
        background: rgba(220, 53, 69, 0.1) !important;
        color: #dc3545 !important;
        border-left-color: #dc3545 !important;
    }

    #loading-screen {
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s;
    }

    .loader {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #fff;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-text {
        font-size: 1.2em;
        color: #fff;
        letter-spacing: 1px;
        font-weight: 300;
    }

    .hide {
        display: none !important;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        .main-container {
            background: rgba(40, 44, 52, 0.95);
            color: #fff;
        }

        label {
            color: #bbb;
        }

        input[type="text"] {
            background: #3a3f47;
            border-color: #4a5058;
            color: #fff;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            background: #2c3e50;
        }

        #result {
            background: rgba(115, 255, 138, 0.1);
            color: #73ff8a;
            border-left-color: #73ff8a;
        }

        .result-error {
            background: rgba(231, 76, 60, 0.1) !important;
            color: #e74c3c !important;
            border-left-color: #e74c3c !important;
        }
    }

    @media (max-width: 600px) {
        body {
            padding: 15px;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 25px;
        }

        .main-container {
            padding: 30px 20px;
        }

        .main-btn {
            font-size: 1.2em;
            padding: 18px;
        }

        .secondary-btn {
            font-size: 1em;
            padding: 12px;
        }
    }
  </style>
</head>

<body>
  <!-- 啟動畫面 -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">載入中…</div>
  </div>

  <h1>伺服馬達控制面板</h1>
  
  <div class="main-container">
    <div id="api-row" class="input-group">
      <label for="api">ESP8266 API網址</label>
      <input id="api" type="text" value="http://192.168.1.123/servo" placeholder="例：http://192.168.1.123/servo">
    </div>
    
    <div id="token-row" class="input-group">
      <label for="token">密碼</label>
      <input id="token" type="text" value="" placeholder="請輸入密碼">
    </div>
    
    <div class="control-section">
      <button id="main-btn" class="main-btn" onclick="sendServo(1)">
        <span class="btn-text">開/關門</span>
        <span id="main-countdown" class="countdown hide"></span>
      </button>
      
      <button id="secondary-btn" class="secondary-btn" onclick="sendServo(0)">
        <span class="btn-text">歸零 (出問題時使用)</span>
        <span id="secondary-countdown" class="countdown hide"></span>
      </button>
    </div>
    
    <div id="result"></div>
  </div>

  <script>
    let isMainBtnDisabled = false;
    let isSecondaryBtnDisabled = false;
    let mainCountdownInterval;
    let secondaryCountdownInterval;

    // 啟動畫面自動隱藏
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        document.getElementById('loading-screen').style.opacity = 0;
        setTimeout(function () {
          document.getElementById('loading-screen').style.display = 'none';
        }, 400);
      }, 800);
    });

    // 取得URL參數自動填值並隱藏input
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const apiParam = getQueryParam('api');
    const tokenParam = getQueryParam('token');
    if (apiParam && tokenParam) {
      document.getElementById('api').value = apiParam.replace(/^"(.*)"$/, '$1');
      document.getElementById('token').value = tokenParam.replace(/^"(.*)"$/, '$1');
      document.getElementById('api-row').classList.add('hide');
      document.getElementById('token-row').classList.add('hide');
    }

    function disableButton(buttonId, countdownId, isMainBtn) {
      const button = document.getElementById(buttonId);
      const countdown = document.getElementById(countdownId);
      const btnText = button.querySelector('.btn-text');
      
      button.disabled = true;
      btnText.classList.add('hide');
      countdown.classList.remove('hide');
      
      if (isMainBtn) {
        isMainBtnDisabled = true;
      } else {
        isSecondaryBtnDisabled = true;
      }
      
      let timeLeft = 5;
      countdown.textContent = timeLeft;
      
      const interval = setInterval(() => {
        timeLeft--;
        countdown.textContent = timeLeft;
        
        if (timeLeft <= 0) {
          clearInterval(interval);
          button.disabled = false;
          btnText.classList.remove('hide');
          countdown.classList.add('hide');
          
          if (isMainBtn) {
            isMainBtnDisabled = false;
          } else {
            isSecondaryBtnDisabled = false;
          }
        }
      }, 1000);
      
      if (isMainBtn) {
        mainCountdownInterval = interval;
      } else {
        secondaryCountdownInterval = interval;
      }
    }

    function sendServo(action) {
      // 檢查按鈕是否被禁用
      if ((action === 1 && isMainBtnDisabled) || (action === 0 && isSecondaryBtnDisabled)) {
        return;
      }
      
      const api = document.getElementById('api').value;
      const token = document.getElementById("token").value;
      const resultDiv = document.getElementById('result');
      
      // 清除之前的錯誤樣式
      resultDiv.classList.remove('result-error');
      resultDiv.innerText = '正在執行...';
      
      // 禁用對應按鈕
      if (action === 1) {
        disableButton('main-btn', 'main-countdown', true);
      } else {
        disableButton('secondary-btn', 'secondary-countdown', false);
      }
      
      const url = api + '?action=' + action + '&token=' + encodeURIComponent(token);

      function request(options) {
        return fetch(url, options).then(r => {
          if (r.type === 'opaque') {
            resultDiv.innerText = '已送出指令';
            return;
          }
          if (!r.ok) {
            return r.text().then(text => {
              throw new Error(text || ('HTTP ' + r.status));
            });
          }
          return r.text().then(text => {
            resultDiv.innerText = text || '成功';
          });
        });
      }

      request({
        headers: { 'ngrok-skip-browser-warning': '1' }
      }).catch(err => {
        return request({
          mode: 'no-cors',
          headers: { 'ngrok-skip-browser-warning': '1' }
        }).catch(() => {
          resultDiv.classList.add('result-error');
          resultDiv.innerText = '連線失敗: ' + err.message;
        });
      });
    }
  </script>
</body>

</html>
